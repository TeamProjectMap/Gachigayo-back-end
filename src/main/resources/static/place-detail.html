<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>같이가요 장소 상세</title>
    <link rel="stylesheet" href="/css/place-detail.css" />
    <link rel="stylesheet" href="/css/map-experience.css" />
    <link rel="stylesheet" href="/css/app-frame.css?v=20261121-black" />
      <link rel="stylesheet" href="/css/figma-skin.css?v=20261120-find">
    <script defer src="/js/figma-skin.js?v=20261118-1"></script>
    <link rel="stylesheet" href="/css/place-detail-top.css?v=20261121-box3">
    <link rel="stylesheet" href="/css/place-endpoints.css?v=20261121-align">
</head>
  <body>
    <main class="place-detail-page hidden" id="placeDetailPage">
      <header class="detail-top">
        <button
          type="button"
          class="back-button"
          id="backButton"
          aria-label="검색 화면으로 돌아가기"
        >
          &lt;
        </button>
        <div class="detail-header">
          <div class="selected-summary">
            <span>선택한 목적지</span>
            <strong id="headerPlaceName">목적지</strong>
          </div>
        </div>
      </header>

      <section
        class="map-preview experience-map"
        id="placeMap"
        aria-label="선택한 장소 지도"
      >
        <span>지도를 불러오는 중입니다.</span>
      </section>

      <section class="place-info">
        <div class="place-title-row">
          <strong id="placeName">장소명</strong>
          <button
            type="button"
            class="favorite-button"
            id="favoriteButton"
            aria-pressed="false"
          >
            ☆ 즐겨찾기
          </button>
        </div>
        <p id="placeAddress">주소 정보 없음</p>
        <span id="placeCategory" class="place-meta hidden"></span>
        <span id="placePhone" class="place-meta hidden"></span>
      </section>

      <p id="detailMessage" class="detail-message" role="status"></p>
      <!-- 현재 위치를 못 가져올 때만 보인다 -->
      <a id="originSearchLink" class="origin-fallback hidden" href="/route-search.html?select=origin">출발지 직접 검색하기</a>

      <!-- 카카오맵처럼: 이 장소를 출발지로 할지, 도착지로 할지 고른다 -->
      <div class="endpoint-actions" id="endpointActions">
        <button type="button" class="origin-button" id="setOriginButton">출발</button>
        <button
          type="button"
          class="confirm-button"
          id="confirmDestinationButton"
        >
          도착
        </button>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/navigation-map.js?v=20261123-speed"></script>
    <script src="/js/place-proximity.js?v=20261106-journey"></script>
    <script src="/js/place-detail.js?v=20261123-speed"></script>
  </body>
</html>
