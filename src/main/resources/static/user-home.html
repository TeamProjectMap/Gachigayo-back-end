<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>같이가요 USER 홈</title>
    <link rel="stylesheet" href="/css/user-home.css">
</head>
</body>
<body>
<main class="home-page hidden" id="userHomePage">
    <header class="home-header">
        <h1>같이가요</h1>
        <button type="button" class="logout-button">로그아웃</button>
    </header>

    <section class="hero-grid">
        <button type="button" class="guide-card action-card route-search-link" data-ready-message="경로 기능은 다음 단계에서 연결 예정입니다.">
            <span class="card-icon">길</span>
            <strong>길안내 &gt;</strong>
            <p>목적지까지<br>안전하게 안내해요</p>
        </button>

        <button type="button" class="small-card action-card" data-ready-message="자주 가는 곳 기능은 다음 단계에서 연결 예정입니다.">
            <strong>자주 가는 곳 &gt;</strong>
            <p>자주 가는 장소로 이동해요</p>
        </button>

        <section class="linked-card">
            <strong id="linkedGuardianText">연결된 보호자를 확인 중입니다</strong>
            <p>이동을 시작하면 위치가 공유됩니다</p>
        </section>
    </section>

    <section class="weather-card">
        <span class="weather-icon" aria-hidden="true">
            <img id="weatherIcon" alt="">
        </span>
        <strong id="temperature" class="weather-temperature"></strong>
        <span class="weather-divider" aria-hidden="true"></span>
        <span class="weather-copy">
            <strong id="weatherMainText" class="weather-main-text"></strong>
            <strong id="weatherSubText" class="weather-sub-text"></strong>
        </span>
    </section>

    <section class="feature-grid" aria-label="홈 기능">
        <button type="button" class="feature-card help-request-link">
            <strong>도움요청</strong>
            <span>도움이 필요할 때</span>
        </button>
        <button type="button" class="feature-card action-card" data-ready-message="체크포인트 기능은 다음 단계에서 연결 예정입니다.">
            <strong>체크포인트</strong>
            <span>정보 없음</span>
        </button>
        <button type="button" class="feature-card action-card" data-ready-message="알림 기능은 다음 단계에서 연결 예정입니다.">
            <strong>알림</strong>
            <span>정보 없음</span>
        </button>
        <button type="button" class="feature-card action-card" data-ready-message="위치 공유 기능은 다음 단계에서 연결 예정입니다.">
            <strong>위치공유</strong>
            <span>준비 중</span>
        </button>
    </section>

    <section class="safety-card">
        <strong>이렇게 해요</strong>
        <p>횡단보도를 건널 때는<br>초록불이 켜졌는지 확인해요!</p>
    </section>

    <p id="homeMessage" class="home-message"></p>

    <nav class="bottom-nav" aria-label="하단 메뉴">
        <button type="button" class="active">홈</button>
        <button type="button" class="action-card route-search-link" data-ready-message="길안내 기능은 다음 단계에서 연결 예정입니다.">길안내</button>
        <button type="button" class="action-card" data-ready-message="설정 화면은 다음 단계에서 연결 예정입니다.">설정</button>
    </nav>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/user-home.js"></script>
<script src="/js/weather.js"></script>
</body>
</html>
