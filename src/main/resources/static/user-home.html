<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>같이가요 USER 홈</title>
    <link rel="stylesheet" href="/css/user-home.css">
    <link rel="stylesheet" href="/css/menu-flow.css?v=20261118-resume">
    <link rel="stylesheet" href="/css/bottom-nav.css?v=20261118">
    <link rel="stylesheet" href="/css/figma-skin.css?v=20261120-find">
    <link rel="stylesheet" href="/css/safety-tips.css?v=20261120">
    <script defer src="/js/figma-skin.js?v=20261118-1"></script>
</head>
<body class="menu-app">
<main class="home-page hidden" id="userHomePage">
    <header class="home-header">
        <h1>같이가요</h1>
    </header>

    <section class="hero-grid">
        <button type="button" class="guide-card action-card route-search-link">
            <span class="card-icon"><img src="/images/figma/de4ac.svg" alt="" data-figma-asset="de4ac.svg"></span>
            <strong>길안내 <img src="/images/figma/694e9.svg" alt="" data-figma-asset="694e9.svg"></strong>
            <p>목적지까지<br>안전하게 안내해요</p>
        </button>

        <!-- 보호자가 같이 걸으며 등록해 준 경로 모음. 고르면 그 목적지로 길안내를 하고,
             보호자가 찍어 둔 체크포인트 사진이 길에서 뜬다 -->
        <button type="button" class="small-card guardian-routes-link" id="guardianRoutesCard">
            <img class="favorite-hero-icon" src="/images/figma/18566.svg" alt="" data-figma-asset="18566.svg"><strong>보호자 경로 <img src="/images/figma/694e9.svg" alt="" data-figma-asset="694e9.svg"></strong>
            <p>보호자가 등록한 길로 안내해요</p>
        </button>

        <button type="button" class="linked-card" id="connectionManageButton">
            <img class="connection-icon" src="/images/figma/b3b0a.svg" alt="" data-figma-asset="b3b0a.svg"><strong id="linkedGuardianText">연결된 보호자를 확인 중입니다</strong>
            <p>이동을 시작하면 위치가 공유됩니다</p>
        </button>
    </section>

    <section class="weather-card">
        <span class="weather-icon" aria-hidden="true">
            <img id="weatherIcon" alt="">
        </span>
        <strong id="temperature" class="weather-temperature"></strong>
        <span class="weather-divider" aria-hidden="true"></span>
        <span class="weather-copy">
            <strong id="weatherMainText" class="weather-main-text"></strong>
            <strong id="weatherSubText" class="weather-sub-text"></strong>
        </span>
    </section>

    <div class="favorites-heading"><strong>즐겨찾기</strong></div>
    <section class="feature-grid" id="homeFavorites" aria-label="자주 가는 곳"></section>

    <!-- 교통안전 문구: 12초마다 무작위로 바뀐다 (js/safety-tips.js). 그림은 직접 그린 SVG -->
    <section class="safety-card" id="safetyCard" aria-label="교통안전 알림">
        <span class="safety-illust" aria-hidden="true"></span>
        <div class="safety-copy">
            <strong><img src="/images/figma/8c3ce.svg" alt="" data-figma-asset="8c3ce.svg"> 이렇게 해요</strong>
            <p class="safety-tip">초록불이 켜져도 차가 멈췄는지 살펴요.</p>
        </div>
    </section>

    <p id="homeMessage" class="home-message"></p>

    <section class="journey-resume-popup" id="journeyResumePopup" aria-label="진행 중인 길안내" hidden>
        <button type="button" class="resume-journey-main" id="resumeJourneyButton">
            <small>길안내 이어가기</small>
            <strong id="activeJourneyTitle"></strong>
            <span id="activeJourneyDescription"></span>
        </button>
        <button type="button" class="dismiss-journey" id="dismissJourneyButton" aria-label="길안내 이어가기 팝업 닫기" title="팝업 닫기">×</button>
    </section>

    <nav class="bottom-nav" aria-label="하단 메뉴">
        <button type="button" class="active" aria-current="page" id="homeNavButton"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M13.45 2.53295C13.0442 2.19098 12.5307 2.00342 12 2.00342C11.4693 2.00342 10.9558 2.19098 10.55 2.53295L3.8 8.22795C3.54946 8.43911 3.34806 8.70243 3.20988 8.99952C3.0717 9.29661 3.00007 9.6203 3 9.94795V19.253C3 20.219 3.784 21.003 4.75 21.003H7.75C8.21413 21.003 8.65925 20.8186 8.98744 20.4904C9.31563 20.1622 9.5 19.7171 9.5 19.253V15.25C9.5 14.57 10.042 14.018 10.717 14H13.283C13.6088 14.0086 13.9183 14.144 14.1456 14.3775C14.373 14.611 14.5001 14.9241 14.5 15.25V19.253C14.5 20.219 15.284 21.003 16.25 21.003H19.25C19.7141 21.003 20.1592 20.8186 20.4874 20.4904C20.8156 20.1622 21 19.7171 21 19.253V9.94695C20.9999 9.6193 20.9283 9.29561 20.7901 8.99852C20.6519 8.70143 20.4505 8.43811 20.2 8.22695L13.45 2.53295Z"/>
            </svg><span>홈</span></button>
        <button type="button" class="action-card route-search-link"><svg viewBox="0 0 22 20" fill="currentColor" aria-hidden="true">
                <path d="M14.6667 18.5977L7.33333 16.4532V1.40237L14.6667 3.54691V18.5977ZM15.8889 18.5508V3.45316L20.7434 1.46487C21.3469 1.21878 22 1.67191 22 2.33597V15.4141C22 15.7969 21.7708 16.1407 21.4233 16.2852L15.8889 18.5469V18.5508ZM0.576736 3.71487L6.11111 1.45316V16.5508L1.2566 18.5352C0.653125 18.7813 0 18.3282 0 17.6641V4.58597C0 4.20316 0.229167 3.85941 0.576736 3.71487Z"/>
            </svg><span>길안내</span></button>
        <button type="button" id="settingNavButton"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M4.33337 6.5H21.6667M4.33337 13H21.6667M4.33337 19.5H21.6667"/>
            </svg><span>설정</span></button>
    </nav>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/navigation-map.js?v=20261123-accuracy"></script>
<script src="/js/journey-state.js?v=20261118-resume"></script>
<script src="/js/user-home.js?v=20261120-gtext"></script>
<script src="/js/weather.js?v=20261120"></script>
<script src="/js/safety-tips.js?v=20261120"></script>
</body>
</html>
