<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>같이가요 비밀번호 찾기</title>
    <link rel="stylesheet" href="/css/find-account.css">
</head>
<body>
<main class="find-page">
    <section id="searchSection" class="find-panel">
        <header class="page-header">
            <h1>비밀번호 찾기</h1>
            <p>가입할 때 등록한 아이디, 이름, 이메일을 입력하고<br>이메일 인증을 완료해주세요.</p>
        </header>

        <form id="searchForm" class="find-form" novalidate>
            <div class="form-field">
                <label for="loginId">아이디 <span>*</span></label>
                <input id="loginId" name="loginId" type="text" placeholder="예) abc1234" autocomplete="username">
                <p class="field-message" data-message-for="loginId"></p>
            </div>

            <div class="form-field">
                <label for="userName">이름 <span>*</span></label>
                <input id="userName" name="userName" type="text" placeholder="김철수" autocomplete="name">
                <p class="field-message" data-message-for="userName"></p>
            </div>

            <div class="form-field">
                <label for="email">이메일 주소 <span>*</span></label>
                <div class="inline-control">
                    <input id="email" name="email" type="email" placeholder="예) abc123@email.com" autocomplete="email">
                    <button type="button" class="small-button" data-action="send-auth">인증하기</button>
                </div>
                <p class="field-message" data-message-for="email"></p>
            </div>

            <div class="form-field auth-field hidden" data-auth-field>
                <label for="authCode">인증번호</label>
                <div class="auth-control">
                    <input id="authCode" name="authCode" type="text" inputmode="numeric" maxlength="6" placeholder="6자리 입력">
                    <span class="timer" data-timer>05:00</span>
                </div>
                <p class="field-message" data-message-for="authCode"></p>
            </div>

            <p class="field-message form-message" data-message-for="searchForm"></p>

            <button type="button" class="submit-button" data-action="search-password">다음</button>
            <button type="button" class="ghost-button" data-action="go-login">로그인</button>

            <div class="find-links">
                <button type="button" class="text-button" data-action="go-find-id">아이디 찾기</button>
                <span aria-hidden="true"></span>
                <button type="button" class="text-button" data-action="go-signup">회원가입</button>
            </div>
        </form>
    </section>

    <section id="newPasswordSection" class="find-panel hidden">
        <header class="page-header">
            <h1 id="newPasswordTitle">비밀번호 재설정</h1>
            <p>새로 사용할 비밀번호를 입력해주세요.</p>
        </header>

        <form id="newPasswordForm" class="find-form" novalidate>
            <div class="form-field">
                <label for="password">새 비밀번호 <span>*</span></label>
                <input id="password" name="password" type="password" placeholder="8~16자 영문, 숫자, 특수문자" autocomplete="new-password">
                <p class="field-message" data-message-for="password"></p>
            </div>

            <div class="form-field">
                <label for="passwordConfirm">새 비밀번호 확인 <span>*</span></label>
                <input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="비밀번호 재입력" autocomplete="new-password">
                <p class="field-message" data-message-for="passwordConfirm"></p>
            </div>

            <p class="field-message form-message" data-message-for="newPasswordForm"></p>

            <button type="button" class="submit-button" data-action="new-password">비밀번호 재설정</button>
            <button type="button" class="ghost-button" data-action="go-login">로그인</button>
        </form>
    </section>

    <section id="resultSection" class="find-panel hidden">
        <div class="result-panel">
            <div class="check-icon" aria-hidden="true"></div>
            <h2>비밀번호가 재설정되었습니다</h2>
            <p>새로운 비밀번호로 로그인해주세요.</p>

            <div class="result-actions">
                <button type="button" class="submit-button" data-action="go-login">로그인</button>
            </div>
        </div>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/find-password.js"></script>
</body>
</html>
