<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도움요청 카드 편집</title>
    <link rel="stylesheet" href="/css/help-card-edit.css">
</head>
<body>
<main class="edit-page hidden" id="helpCardEditPage">
    <header class="edit-header">
        <button type="button" class="back-button" id="backButton" aria-label="뒤로가기">&lt;</button>
        <h1>카드 편집하기</h1>
    </header>

    <section class="edit-section">
        <h2>기본 문구 선택</h2>
        <div class="preset-list" role="radiogroup" aria-label="도움요청 기본 문구">
            <button type="button" class="preset-card selected" data-message="저는 발달장애가 있으며,&#10;혼자 이동하다 길을 헤매고 있습니다&#10;아래 목적지로 갈 수 있도록 도와주세요" role="radio" aria-checked="true">
                저는 발달장애가 있으며,<br>혼자 이동하다 길을 헤매고 있습니다<br>아래 목적지로 갈 수 있도록 도와주세요
            </button>
            <button type="button" class="preset-card" data-message="저는 혼자 이동 중 도움이 필요합니다" role="radio" aria-checked="false">
                저는 혼자 이동 중 도움이 필요합니다
            </button>
            <button type="button" class="preset-card" id="customPresetButton" role="radio" aria-checked="false">
                직접입력
            </button>
        </div>

        <label class="custom-box hidden" id="customBox" for="customMessage">
            <span>직접 입력</span>
            <textarea id="customMessage" maxlength="500" rows="6" placeholder="도움이 필요한 상황을 적어주세요"></textarea>
        </label>
    </section>

    <p class="edit-message" id="editMessage"></p>
    <button type="button" class="save-button" id="saveButton">저장하기</button>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/help-card-edit.js"></script>
</body>
</html>
