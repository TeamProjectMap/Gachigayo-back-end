<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>장소 검색 · 같이가요</title>
    <link rel="stylesheet" href="/css/map-experience.css" />
    <link rel="stylesheet" href="/css/app-frame.css?v=20261106-relevance" />
      <link rel="stylesheet" href="/css/bottom-nav.css?v=20261118-search">
      <link rel="stylesheet" href="/css/figma-skin.css?v=20261118-1">
    <script defer src="/js/figma-skin.js?v=20261118-1"></script>
    <link rel="stylesheet" href="/css/route-search-map.css?v=20261120-g">
</head>
  <body>
    <main class="map-layout" id="routeSearchPage" hidden>
      <!-- 검색하면 화면 전체에 깔리는 지도 (카카오맵처럼) -->
      <div class="search-bg-map">
        <section id="searchMap" class="experience-map" aria-label="검색 결과 지도">
          지도를 불러오는 중입니다.
        </section>
      </div>
      <aside class="map-sidebar">
        <header class="map-header">
          <a id="searchBackButton" href="/user-home.html" aria-label="뒤로 가기"
            >←</a
          >
          <div>
            
            <h1 id="searchTitle">어디로 갈까요?</h1>
          </div>
        </header>
        <form id="searchForm" class="map-search" role="search">
          <label for="destinationSearchInput" class="sr-only"
            >장소 이름 또는 주소</label
          >
          <div class="search-input-row">
            <input
              id="destinationSearchInput"
              type="search"
              autocomplete="off"
              maxlength="100"
              placeholder="장소, 주소, 지하철역 검색"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="autocompleteList"
              aria-expanded="false"
              aria-describedby="autocompleteStatus"
              enterkeyhint="search"
            />
          </div>
        </form>
        <p
          id="autocompleteStatus"
          class="autocomplete-status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <ul
          id="autocompleteList"
          class="suggestions"
          role="listbox"
          aria-label="추천 장소"
          hidden
        ></ul>

        <nav class="saved-tabs" aria-label="장소 목록">
          <button type="button" data-list="favorites" aria-pressed="false">자주 가는 곳</button
          ><button type="button" data-list="recent" aria-pressed="false">최근 검색</button>
        </nav>
        <div class="result-sheet" id="resultSheet">
        <p id="searchMessage" class="map-status" role="status">
          장소 이름이나 주소를 입력해주세요.
        </p>
        <div
          id="placeResultList"
          class="map-results"
          aria-label="장소 목록"
        ></div>
        <button type="button" id="moreResults" class="secondary-action" hidden>
          결과 더 보기
        </button>
        </div>
        <div class="search-nav-space" aria-hidden="true"></div>
        <nav class="bottom-nav" aria-label="하단 메뉴"><a href="/user-home.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M13.45 2.53295C13.0442 2.19098 12.5307 2.00342 12 2.00342C11.4693 2.00342 10.9558 2.19098 10.55 2.53295L3.8 8.22795C3.54946 8.43911 3.34806 8.70243 3.20988 8.99952C3.0717 9.29661 3.00007 9.6203 3 9.94795V19.253C3 20.219 3.784 21.003 4.75 21.003H7.75C8.21413 21.003 8.65925 20.8186 8.98744 20.4904C9.31563 20.1622 9.5 19.7171 9.5 19.253V15.25C9.5 14.57 10.042 14.018 10.717 14H13.283C13.6088 14.0086 13.9183 14.144 14.1456 14.3775C14.373 14.611 14.5001 14.9241 14.5 15.25V19.253C14.5 20.219 15.284 21.003 16.25 21.003H19.25C19.7141 21.003 20.1592 20.8186 20.4874 20.4904C20.8156 20.1622 21 19.7171 21 19.253V9.94695C20.9999 9.6193 20.9283 9.29561 20.7901 8.99852C20.6519 8.70143 20.4505 8.43811 20.2 8.22695L13.45 2.53295Z"/>
            </svg><span>홈</span></a><a href="/route-search.html" class="active" aria-current="page"><svg viewBox="0 0 22 20" fill="currentColor" aria-hidden="true">
                <path d="M14.6667 18.5977L7.33333 16.4532V1.40237L14.6667 3.54691V18.5977ZM15.8889 18.5508V3.45316L20.7434 1.46487C21.3469 1.21878 22 1.67191 22 2.33597V15.4141C22 15.7969 21.7708 16.1407 21.4233 16.2852L15.8889 18.5469V18.5508ZM0.576736 3.71487L6.11111 1.45316V16.5508L1.2566 18.5352C0.653125 18.7813 0 18.3282 0 17.6641V4.58597C0 4.20316 0.229167 3.85941 0.576736 3.71487Z"/>
            </svg><span>길안내</span></a><a href="/settings.html"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M4.33337 6.5H21.6667M4.33337 13H21.6667M4.33337 19.5H21.6667"/>
            </svg><span>설정</span></a></nav>
      </aside>
      <button
        type="button"
        id="searchThisArea"
        class="search-area-button"
        hidden
      >
        이 지도 중심으로 검색
      </button>
      <button type="button" id="locateButton" class="locate-button" aria-label="내 위치로 이동">
        ◎
      </button>
    </main>
    <script src="/js/navigation-map.js?v=20261106-relevance"></script>
    <script src="/js/place-proximity.js?v=20261106-relevance"></script>
    <script src="/js/route-search.js?v=20261119-nocount"></script>
  </body>
</html>
