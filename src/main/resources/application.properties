spring.application.name=gachigayo
spring.profiles.active=local

server.port=20000

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Kakao Local REST API
kakao.rest-api-key=${KAKAO_REST_API_KEY:}

# Public data and Seoul bus APIs
public-data.api-key=${PUBLIC_DATA_API_KEY:}
seoul.bus-route-api-key=${SEOUL_BUS_ROUTE_API_KEY:}
seoul.bus-stop-api-key=${SEOUL_BUS_STOP_API_KEY:}
seoul.subway.realtime-api-key=${SEOUL_SUBWAY_REALTIME_API_KEY:}

# \uB85C\uADF8
logging.level.com.baegopa.onestep=debug

spring.datasource.url=jdbc:mariadb://192.168.31.129:3306/gachigayo
spring.datasource.username=gachigayo
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Gmail SMTP
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

